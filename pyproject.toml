[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storage-viewer"
version = "1.0.1"
description = "Advanced directory tree visualizer with filtering options"
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
authors = [
    { name = "Lingaraj Sa" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
stree = "SourceCode.main:main"

[project.urls]
Homepage = "https://github.com/info-fusion-tech-lab/storage-viewer"
Repository = "https://github.com/info-fusion-tech-lab/storage-viewer"

[tool.setuptools]
packages = ["SourceCode"]
